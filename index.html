<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15-Tile Puzzle</title>
<style>
  :root {
    --bg: #1a1d21;
    --panel: #24282e;
    --tile: #f0ede6;
    --tile-text: #1a1d21;
    --accent: #2e7d4f;
    --accent-hover: #35905c;
    --muted: #9aa0a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: #ececec;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  h1 { font-size: 28px; margin: 0 0 4px; font-weight: 700; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .stats {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    font-size: 15px;
  }
  .stats b { font-variant-numeric: tabular-nums; }
  #board {
    position: relative;
    width: min(88vw, 400px);
    height: min(88vw, 400px);
    background: var(--panel);
    border-radius: 12px;
    padding: 8px;
    touch-action: manipulation;
    user-select: none;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    background: var(--tile);
    color: var(--tile-text);
    border-radius: 8px;
    cursor: pointer;
    border: 0;
    padding: 0;
    transition: transform 120ms ease-in-out;
  }
  .tile:hover { filter: brightness(0.94); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tile.correct { background: #cde8d4; }
  .controls { display: flex; gap: 12px; margin-top: 20px; }
  button.action {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.action:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    color: #ececec;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #message {
    margin-top: 16px;
    min-height: 24px;
    font-size: 16px;
    font-weight: 600;
    color: #7ddf9a;
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
  }
</style>
</head>
<body>
<h1>15-Puzzle</h1>
<p class="sub">Slide tiles into order 1&ndash;15. Click a tile next to the empty square, or use arrow keys.</p>
<div class="stats">
  <span>Moves: <b id="moves">0</b></span>
  <span>Time: <b id="time">0:00</b></span>
  <span>Best: <b id="best">–</b></span>
</div>
<div id="board" role="grid" aria-label="15-puzzle board"></div>
<div class="controls">
  <button class="action" id="shuffleBtn">Shuffle</button>
  <button class="secondary" id="solveBtn">Reset</button>
</div>
<div id="message" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var SIZE = 4;
  var boardEl = document.getElementById('board');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var msgEl = document.getElementById('message');
  var bestEl = document.getElementById('best');
  var shuffleBtn = document.getElementById('shuffleBtn');
  var solveBtn = document.getElementById('solveBtn');
  var BEST_KEY = 'fifteen-puzzle-best';
  var best = loadBest();

  var tiles = [];      // values 1..15, 0 = empty; index = cell 0..15
  var moves = 0;
  var startTime = null;
  var timerId = null;
  var won = false;
  var tileEls = {};    // value -> button element (1..15)

  function boardMetrics() {
    var pad = 8;
    var cell = (boardEl.clientWidth - pad * 2) / SIZE;
    return { pad: pad, cell: cell };
  }

  function createTiles() {
    for (var v = 1; v <= 15; v++) {
      var b = document.createElement('button');
      b.className = 'tile';
      b.textContent = String(v);
      b.setAttribute('aria-label', 'Tile ' + v);
      (function (val) {
        b.addEventListener('click', function () { tryMove(val); });
      })(v);
      boardEl.appendChild(b);
      tileEls[v] = b;
    }
  }

  function layout() {
    var m = boardMetrics();
    var gap = 6;
    var side = m.cell - gap;
    for (var v = 1; v <= 15; v++) {
      var idx = tiles.indexOf(v);
      var r = Math.floor(idx / SIZE);
      var c = idx % SIZE;
      var el = tileEls[v];
      el.style.width = side + 'px';
      el.style.height = side + 'px';
      el.style.transform = 'translate(' + (m.pad + c * m.cell + gap / 2) + 'px,' + (m.pad + r * m.cell + gap / 2) + 'px)';
      el.classList.toggle('correct', idx === v - 1);
    }
  }

  function solvedState() {
    var s = [];
    for (var i = 1; i <= 15; i++) s.push(i);
    s.push(0);
    return s;
  }

  function isSolved() {
    for (var i = 0; i < 15; i++) {
      if (tiles[i] !== i + 1) return false;
    }
    return tiles[15] === 0;
  }

  function neighborsOf(emptyIdx) {
    var r = Math.floor(emptyIdx / SIZE);
    var c = emptyIdx % SIZE;
    var out = [];
    if (r > 0) out.push(emptyIdx - SIZE);
    if (r < SIZE - 1) out.push(emptyIdx + SIZE);
    if (c > 0) out.push(emptyIdx - 1);
    if (c < SIZE - 1) out.push(emptyIdx + 1);
    return out;
  }

  function shuffle() {
    tiles = solvedState();
    var empty = 15;
    var prev = -1;
    for (var i = 0; i < 500; i++) {
      var opts = neighborsOf(empty).filter(function (n) { return n !== prev; });
      var pick = opts[Math.floor(Math.random() * opts.length)];
      tiles[empty] = tiles[pick];
      tiles[pick] = 0;
      prev = empty;
      empty = pick;
    }
    // Avoid dealing a solved board.
    if (isSolved()) shuffle();
  }

  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerId = setInterval(tick, 500);
  }

  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function tick() {
    var s = Math.floor((Date.now() - startTime) / 1000);
    timeEl.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function newGame(shuffled) {
    moves = 0;
    won = false;
    movesEl.textContent = '0';
    timeEl.textContent = '0:00';
    msgEl.textContent = '';
    tiles = shuffled ? solvedState() : solvedState();
    if (shuffled) shuffle();
    startTimer();
    layout();
  }

  function tryMove(val) {
    if (won) return false;
    var idx = tiles.indexOf(val);
    var empty = tiles.indexOf(0);
    if (neighborsOf(empty).indexOf(idx) === -1) return false;
    tiles[empty] = val;
    tiles[idx] = 0;
    moves++;
    movesEl.textContent = String(moves);
    layout();
    if (isSolved()) {
      won = true;
      stopTimer();
      recordWin();
    }
    return true;
  }

  function elapsedSeconds() {
    if (!startTime) return 0;
    return Math.floor((Date.now() - startTime) / 1000);
  }

  function loadBest() {
    try {
      var raw = window.localStorage.getItem(BEST_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed.score !== 'number') return null;
      return parsed;
    } catch (e) {
      return null;
    }
  }

  function renderBest() {
    bestEl.textContent = best ? String(best.score) : '–';
  }

  function recordWin() {
    var seconds = elapsedSeconds();
    var score = Math.max(1, 1000 - moves * 10 - seconds);
    var isBest = !best || score > best.score;
    if (isBest) {
      best = { score: score, moves: moves, seconds: seconds };
      try {
        window.localStorage.setItem(BEST_KEY, JSON.stringify(best));
      } catch (e) { /* storage unavailable; best still shown this session */ }
      renderBest();
    }
    msgEl.textContent = 'Solved in ' + moves + ' moves! Score: ' + score + '.' +
      (isBest ? ' New best!' : '');
  }

  // Test helper: place an exact board and reset per-game state.
  function setTiles(state) {
    tiles = state.slice();
    moves = 0;
    won = false;
    movesEl.textContent = '0';
    msgEl.textContent = '';
    layout();
  }

  // Arrow keys move a tile into the empty square.
  document.addEventListener('keydown', function (e) {
    var empty = tiles.indexOf(0);
    var r = Math.floor(empty / SIZE);
    var c = empty % SIZE;
    var target = -1;
    if (e.key === 'ArrowUp' && r < SIZE - 1) target = empty + SIZE;
    else if (e.key === 'ArrowDown' && r > 0) target = empty - SIZE;
    else if (e.key === 'ArrowLeft' && c < SIZE - 1) target = empty + 1;
    else if (e.key === 'ArrowRight' && c > 0) target = empty - 1;
    else return;
    e.preventDefault();
    tryMove(tiles[target]);
  });

  shuffleBtn.addEventListener('click', function () { newGame(true); });
  solveBtn.addEventListener('click', function () { newGame(false); });
  window.addEventListener('resize', layout);

  createTiles();
  newGame(true);
  renderBest();

  // Expose for smoke testing.
  window.__puzzle = {
    tryMove: tryMove,
    newGame: newGame,
    isSolved: isSolved,
    setTiles: setTiles,
    getTiles: function () { return tiles.slice(); },
    getMoves: function () { return moves; }
  };
})();
</script>
</body>
</html>
