<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15-Tile Puzzle</title>
<style>
  :root {
    --bg: #1a1d21;
    --panel: #24282e;
    --tile: #f0ede6;
    --tile-text: #1a1d21;
    --accent: #2e7d4f;
    --accent-hover: #35905c;
    --muted: #9aa0a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: #ececec;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  h1 { font-size: 28px; margin: 0 0 4px; font-weight: 700; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .stats {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    font-size: 15px;
  }
  .stats b { font-variant-numeric: tabular-nums; }
  #board {
    position: relative;
    width: min(88vw, 400px);
    height: min(88vw, 400px);
    background: var(--panel);
    border-radius: 12px;
    padding: 8px;
    touch-action: manipulation;
    user-select: none;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    background: var(--tile);
    color: var(--tile-text);
    border-radius: 8px;
    cursor: pointer;
    border: 0;
    padding: 0;
    transition: transform 120ms ease-in-out;
  }
  .tile:hover { filter: brightness(0.94); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tile.correct { background: #cde8d4; }
  .controls { display: flex; gap: 12px; margin-top: 20px; }
  button.action {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.action:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    color: #ececec;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
  }
  button.action:disabled,
  button.secondary:disabled {
    opacity: 0.55;
    cursor: wait;
  }
  #message {
    margin-top: 16px;
    min-height: 24px;
    font-size: 16px;
    font-weight: 600;
    color: #7ddf9a;
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
  }
</style>
</head>
<body>
<h1>15-Puzzle</h1>
<p class="sub">Slide tiles into order 1&ndash;15. Click a tile next to the empty square, or use arrow keys.</p>
<div class="stats">
  <span>Moves: <b id="moves">0</b></span>
  <span>Time: <b id="time">0:00</b></span>
  <span>Best: <b id="best">–</b></span>
</div>
<div id="board" role="grid" aria-label="15-puzzle board"></div>
<div class="controls">
  <button class="action" id="shuffleBtn">Shuffle</button>
  <button class="secondary" id="stepBtn">Next Step</button>
  <button class="secondary" id="solveBtn">Reset</button>
</div>
<div id="message" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var SIZE = 4;
  var boardEl = document.getElementById('board');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var msgEl = document.getElementById('message');
  var bestEl = document.getElementById('best');
  var shuffleBtn = document.getElementById('shuffleBtn');
  var solveBtn = document.getElementById('solveBtn');
  var stepBtn = document.getElementById('stepBtn');
  var BEST_KEY = 'fifteen-puzzle-best-moves';
  var best = loadBest();

  var tiles = [];      // values 1..15, 0 = empty; index = cell 0..15
  var moves = 0;
  var startTime = null;
  var timerId = null;
  var won = false;
  var tileEls = {};    // value -> button element (1..15)

  function boardMetrics() {
    var pad = 8;
    var cell = (boardEl.clientWidth - pad * 2) / SIZE;
    return { pad: pad, cell: cell };
  }

  function createTiles() {
    for (var v = 1; v <= 15; v++) {
      var b = document.createElement('button');
      b.className = 'tile';
      b.textContent = String(v);
      b.setAttribute('aria-label', 'Tile ' + v);
      (function (val) {
        b.addEventListener('click', function () { tryMove(val); });
      })(v);
      boardEl.appendChild(b);
      tileEls[v] = b;
    }
  }

  function layout() {
    var m = boardMetrics();
    var gap = 6;
    var side = m.cell - gap;
    for (var v = 1; v <= 15; v++) {
      var idx = tiles.indexOf(v);
      var r = Math.floor(idx / SIZE);
      var c = idx % SIZE;
      var el = tileEls[v];
      el.style.width = side + 'px';
      el.style.height = side + 'px';
      el.style.transform = 'translate(' + (m.pad + c * m.cell + gap / 2) + 'px,' + (m.pad + r * m.cell + gap / 2) + 'px)';
      el.classList.toggle('correct', idx === v - 1);
    }
  }

  function solvedState() {
    var s = [];
    for (var i = 1; i <= 15; i++) s.push(i);
    s.push(0);
    return s;
  }

  function isSolved() {
    for (var i = 0; i < 15; i++) {
      if (tiles[i] !== i + 1) return false;
    }
    return tiles[15] === 0;
  }

  function neighborsOf(emptyIdx) {
    var r = Math.floor(emptyIdx / SIZE);
    var c = emptyIdx % SIZE;
    var out = [];
    if (r > 0) out.push(emptyIdx - SIZE);
    if (r < SIZE - 1) out.push(emptyIdx + SIZE);
    if (c > 0) out.push(emptyIdx - 1);
    if (c < SIZE - 1) out.push(emptyIdx + 1);
    return out;
  }

  // --- Optimal step-through (IDA* with Manhattan + linear conflict) ---
  var hintPlan = null;   // remaining tile values of the optimal solution
  var hintKey = null;    // board fingerprint the plan was computed for
  var solving = false;
  var applyingHint = false;

  var GOAL_R = [];
  var GOAL_C = [];
  var MANH = [];
  (function initHeuristicTables() {
    for (var v = 0; v <= 15; v++) {
      GOAL_R[v] = v === 0 ? SIZE - 1 : Math.floor((v - 1) / SIZE);
      GOAL_C[v] = v === 0 ? SIZE - 1 : (v - 1) % SIZE;
      MANH[v] = [];
      for (var p = 0; p < 16; p++) {
        MANH[v][p] = v === 0 ? 0 :
          Math.abs(GOAL_R[v] - Math.floor(p / SIZE)) + Math.abs(GOAL_C[v] - (p % SIZE));
      }
    }
  })();

  function boardKey(s) {
    return s.join(',');
  }

  function clearHint() {
    hintPlan = null;
    hintKey = null;
  }

  // Admissible heuristic: Manhattan distance + 2 per linear conflict.
  function heuristic(state) {
    var m = 0;
    var i, v;
    for (i = 0; i < 16; i++) {
      v = state[i];
      if (v) m += MANH[v][i];
    }
    var lc = 0;
    var r, c1, c2, r1, r2, v1, v2;
    for (r = 0; r < SIZE; r++) {
      for (c1 = 0; c1 < SIZE; c1++) {
        v1 = state[r * SIZE + c1];
        if (!v1 || GOAL_R[v1] !== r) continue;
        for (c2 = c1 + 1; c2 < SIZE; c2++) {
          v2 = state[r * SIZE + c2];
          if (!v2 || GOAL_R[v2] !== r) continue;
          if (GOAL_C[v1] > GOAL_C[v2]) lc++;
        }
      }
    }
    for (c1 = 0; c1 < SIZE; c1++) {
      for (r1 = 0; r1 < SIZE; r1++) {
        v1 = state[r1 * SIZE + c1];
        if (!v1 || GOAL_C[v1] !== c1) continue;
        for (r2 = r1 + 1; r2 < SIZE; r2++) {
          v2 = state[r2 * SIZE + c1];
          if (!v2 || GOAL_C[v2] !== c1) continue;
          if (GOAL_R[v1] > GOAL_R[v2]) lc++;
        }
      }
    }
    return m + 2 * lc;
  }

  function isSolvableState(s) {
    var inv = 0;
    var i, j;
    for (i = 0; i < 16; i++) {
      if (!s[i]) continue;
      for (j = i + 1; j < 16; j++) {
        if (s[j] && s[i] > s[j]) inv++;
      }
    }
    var blankRowFromBottom = SIZE - Math.floor(s.indexOf(0) / SIZE);
    return (inv + blankRowFromBottom) % 2 === 1;
  }

  // Depth-first search bounded by f = g + h. Returns -1 when the goal is
  // reached (path holds the tile values moved), else the next bound.
  // Child heuristic values are computed once for move ordering and reused.
  function hintSearch(state, empty, g, bound, prevEmpty, path, h) {
    if (g + h > bound) return g + h;
    if (h === 0) return -1;
    var r = Math.floor(empty / SIZE);
    var c = empty % SIZE;
    var nbs = [];
    if (r > 0 && empty - SIZE !== prevEmpty) nbs.push(empty - SIZE);
    if (r < SIZE - 1 && empty + SIZE !== prevEmpty) nbs.push(empty + SIZE);
    if (c > 0 && empty - 1 !== prevEmpty) nbs.push(empty - 1);
    if (c < SIZE - 1 && empty + 1 !== prevEmpty) nbs.push(empty + 1);
    var scored = [];
    var k, nb, tileVal, hh;
    for (k = 0; k < nbs.length; k++) {
      nb = nbs[k];
      tileVal = state[nb];
      state[empty] = tileVal;
      state[nb] = 0;
      hh = heuristic(state);
      state[nb] = tileVal;
      state[empty] = 0;
      scored.push({ nb: nb, val: tileVal, h: hh });
    }
    scored.sort(function (a, b) { return a.h - b.h; });
    var min = Infinity;
    var s, t;
    for (s = 0; s < scored.length; s++) {
      nb = scored[s].nb;
      tileVal = scored[s].val;
      state[empty] = tileVal;
      state[nb] = 0;
      path.push(tileVal);
      t = hintSearch(state, nb, g + 1, bound, empty, path, scored[s].h);
      if (t === -1) return -1;
      if (t < min) min = t;
      path.pop();
      state[nb] = tileVal;
      state[empty] = 0;
    }
    return min;
  }

  // Returns the optimal list of tile values to move, or null if unsolvable.
  function computeOptimalPlan(start) {
    if (!isSolvableState(start)) return null;
    var state = start.slice();
    var h = heuristic(state);
    var bound = h;
    var path = [];
    var empty = state.indexOf(0);
    for (;;) {
      var t = hintSearch(state, empty, 0, bound, -1, path, h);
      if (t === -1) return path;
      if (t === Infinity) return null;
      bound = t;
    }
  }

  function setSolving(on) {
    solving = on;
    stepBtn.disabled = on;
    stepBtn.textContent = on ? 'Solving…' : 'Next Step';
  }

  function applyHintMove() {
    var val = hintPlan.shift();
    applyingHint = true;
    try {
      tryMove(val);
    } finally {
      applyingHint = false;
    }
    // The remaining plan was computed for the board after this move.
    hintKey = boardKey(tiles);
    if (!won && hintPlan) {
      msgEl.textContent = 'Optimal step applied — ' + hintPlan.length +
        (hintPlan.length === 1 ? ' move to go.' : ' moves to go.');
    }
  }

  // Applies one move of an optimal solution. Computes (and caches) the full
  // optimal plan on first use; later clicks consume the cached plan. Resolves
  // to true when a move was applied.
  function stepOptimal() {
    if (solving) return Promise.resolve(false);
    if (won || isSolved()) {
      msgEl.textContent = 'Already solved.';
      return Promise.resolve(false);
    }
    if (hintPlan && hintPlan.length && hintKey === boardKey(tiles)) {
      applyHintMove();
      return Promise.resolve(true);
    }
    setSolving(true);
    msgEl.textContent = 'Finding optimal move…';
    return new Promise(function (resolve) {
      // Let the status paint before the synchronous search blocks the thread.
      // Deeply shuffled boards can take a few seconds on the first step;
      // every later step is instant until the board is changed by hand.
      setTimeout(function () {
        var plan = computeOptimalPlan(tiles);
        setSolving(false);
        if (!plan || !plan.length) {
          clearHint();
          msgEl.textContent = 'No solution found for this board.';
          resolve(false);
          return;
        }
        hintPlan = plan;
        hintKey = boardKey(tiles);
        applyHintMove();
        resolve(true);
      }, 30);
    });
  }

  function shuffle() {
    tiles = solvedState();
    var empty = 15;
    var prev = -1;
    for (var i = 0; i < 500; i++) {
      var opts = neighborsOf(empty).filter(function (n) { return n !== prev; });
      var pick = opts[Math.floor(Math.random() * opts.length)];
      tiles[empty] = tiles[pick];
      tiles[pick] = 0;
      prev = empty;
      empty = pick;
    }
    // Avoid dealing a solved board.
    if (isSolved()) shuffle();
  }

  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerId = setInterval(tick, 500);
  }

  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function tick() {
    var s = Math.floor((Date.now() - startTime) / 1000);
    timeEl.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function newGame(shuffled) {
    clearHint();
    moves = 0;
    won = false;
    movesEl.textContent = '0';
    timeEl.textContent = '0:00';
    msgEl.textContent = '';
    tiles = shuffled ? solvedState() : solvedState();
    if (shuffled) shuffle();
    startTimer();
    layout();
  }

  function tryMove(val) {
    if (won) return false;
    var idx = tiles.indexOf(val);
    var empty = tiles.indexOf(0);
    if (neighborsOf(empty).indexOf(idx) === -1) return false;
    tiles[empty] = val;
    tiles[idx] = 0;
    // A manual move leaves the cached optimal plan behind.
    if (!applyingHint) clearHint();
    moves++;
    movesEl.textContent = String(moves);
    layout();
    if (isSolved()) {
      won = true;
      stopTimer();
      recordWin();
    }
    return true;
  }

  function elapsedSeconds() {
    if (!startTime) return 0;
    return Math.floor((Date.now() - startTime) / 1000);
  }

  function loadBest() {
    try {
      var raw = window.localStorage.getItem(BEST_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed.score !== 'number') return null;
      return parsed;
    } catch (e) {
      return null;
    }
  }

  function renderBest() {
    bestEl.textContent = best ? String(best.score) : '–';
  }

  function recordWin() {
    var seconds = elapsedSeconds();
    var score = moves;
    var isBest = !best || score < best.score;
    if (isBest) {
      best = { score: score, moves: moves, seconds: seconds };
      try {
        window.localStorage.setItem(BEST_KEY, JSON.stringify(best));
      } catch (e) { /* storage unavailable; best still shown this session */ }
      renderBest();
    }
    msgEl.textContent = 'Solved in ' + moves + ' moves! Score: ' + score + '.' +
      (isBest ? ' New best!' : '');
  }

  // Test helper: place an exact board and reset per-game state.
  function setTiles(state) {
    clearHint();
    tiles = state.slice();
    moves = 0;
    won = false;
    movesEl.textContent = '0';
    timeEl.textContent = '0:00';
    msgEl.textContent = '';
    startTimer();
    layout();
  }

  // Arrow keys move a tile into the empty square.
  document.addEventListener('keydown', function (e) {
    var empty = tiles.indexOf(0);
    var r = Math.floor(empty / SIZE);
    var c = empty % SIZE;
    var target = -1;
    if (e.key === 'ArrowUp' && r < SIZE - 1) target = empty + SIZE;
    else if (e.key === 'ArrowDown' && r > 0) target = empty - SIZE;
    else if (e.key === 'ArrowLeft' && c < SIZE - 1) target = empty + 1;
    else if (e.key === 'ArrowRight' && c > 0) target = empty - 1;
    else return;
    e.preventDefault();
    tryMove(tiles[target]);
  });

  shuffleBtn.addEventListener('click', function () { newGame(true); });
  solveBtn.addEventListener('click', function () { newGame(false); });
  stepBtn.addEventListener('click', function () { stepOptimal(); });
  window.addEventListener('resize', layout);

  createTiles();
  newGame(true);
  renderBest();

  // Expose for smoke testing.
  window.__puzzle = {
    tryMove: tryMove,
    newGame: newGame,
    isSolved: isSolved,
    setTiles: setTiles,
    getTiles: function () { return tiles.slice(); },
    getMoves: function () { return moves; },
    stepOptimal: stepOptimal,
    hintRemaining: function () {
      return (hintPlan && hintKey === boardKey(tiles)) ? hintPlan.length : 0;
    }
  };
})();
</script>
</body>
</html>
